<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sotaque — em breve</title>
<meta name="description" content="Agência criativa de branding, social media, marketing digital e software. Nascida em Recife, com ouvido pra todo sotaque do Brasil.">
<meta name="theme-color" content="#212C29">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sotaqueagencia.com.br/">
<meta property="og:site_name" content="Sotaque">
<meta property="og:title" content="Sotaque — em breve">
<meta property="og:description" content="Agência criativa de branding, social media, marketing digital e software. Nascida em Recife, com ouvido pra todo sotaque do Brasil.">
<meta property="og:image" content="https://sotaqueagencia.com.br/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#212C29;color:#F5ECDC;font-family:'Archivo',system-ui,sans-serif}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;overflow:hidden;position:relative}
.wall{position:absolute;inset:-160px;display:grid;grid-template-columns:repeat(auto-fill,120px);grid-auto-rows:120px;opacity:.07;pointer-events:none;transform:rotate(-6deg)}
.wall i{background-size:cover}
.box{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.grid{position:relative;width:70px;height:70px;margin-bottom:44px}
.cb{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:5px;background-size:cover;animation:mv 2.16s cubic-bezier(.65,0,.35,1) infinite}
.c2{animation-delay:-1.44s}.c3{animation-delay:-.72s}
@keyframes mv{0%{transform:translate(0,0)}6.25%,25%{transform:translate(38px,0)}31.25%,50%{transform:translate(38px,38px)}56.25%,75%{transform:translate(0,38px)}81.25%,100%{transform:translate(0,0)}}
.wm{width:min(560px,82vw);height:auto;display:block}
.soon{font-family:'Gochi Hand',cursive;font-size:clamp(34px,6vw,56px);color:#E5CB5A;margin:18px 0 0;transform:rotate(-4deg)}
p.t{font-size:clamp(16px,2.2vw,19px);line-height:1.5;max-width:460px;margin:28px 0 30px;color:rgba(245,236,220,.82)}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 26px;border-radius:999px;text-decoration:none;font-weight:700;font-size:16px;transition:transform .3s cubic-bezier(.2,1.5,.4,1),background .2s}
.btn.a{background:#F5ECDC;color:#212C29}.btn.a:hover{background:#E5CB5A;transform:translateY(-3px) rotate(-2.5deg)}
.btn.b{color:#F5ECDC;box-shadow:inset 0 0 0 2px #F5ECDC}.btn.b:hover{background:#F5ECDC;color:#212C29;transform:translateY(-3px) rotate(2deg)}
.btn:focus-visible{outline:3px dashed #E5CB5A;outline-offset:4px}
.foot{position:absolute;bottom:22px;left:0;right:0;font-size:13px;color:rgba(245,236,220,.5)}
@media (prefers-reduced-motion:reduce){.cb{animation-duration:6s}}
</style>
</head>
<body>
<div class="wall" aria-hidden="true" id="wall"></div>
<main class="box">
<div class="grid" aria-hidden="true">
<i class="cb c1" style="background-image:url(/assets/cobogo-cobi2.webp)"></i>
<i class="cb c2" style="background-image:url(/assets/cobogo-cobi4.webp)"></i>
<i class="cb c3" style="background-image:url(/assets/cobogo-cobi10.webp)"></i>
</div>
<h1 style="margin:0"><img class="wm" src="/assets/wordmark_cream.webp" alt="Sotaque"></h1>
<p class="soon">em breve</p>
<p class="t">Tamo afinando o sotaque do site novo. Enquanto isso, a gente segue criando marcas, redes e sites. Bora conversar?</p>
<div class="btns">
<a class="btn a" href="mailto:contato@sotaqueagencia.com">contato@sotaqueagencia.com</a>
<a class="btn b" href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram</a>
</div>
</main>
<div class="foot">Feito com sotaque em Recife</div>
<script>
(function(){var w=document.getElementById('wall'),n=['cobi0','cobi3','cobi5','cobi7','cobi9','cobi11','cobi12','cobi13','cobi1','cobi6','cobi8'],h='';
for(var i=0;i<400;i++)h+='<i style="background-image:url(/assets/cobogo-'+n[(i*7+Math.floor(i/11)*3)%n.length]+'.webp)"></i>';w.innerHTML=h;})();
</script>
</body>
</html>
